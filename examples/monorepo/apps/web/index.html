<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example app</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 32rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      label {
        flex-basis: 100%;
        font-weight: 600;
      }
      input,
      button {
        font: inherit;
        padding: 0.5rem 0.75rem;
      }
      input {
        flex: 1 1 12rem;
        min-width: 0;
      }
      :focus-visible {
        outline: 2px solid Highlight;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
